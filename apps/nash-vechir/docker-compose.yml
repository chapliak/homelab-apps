services:
  nash-vechir:
    # Built on the server and pushed to a registry bound to 127.0.0.1 (see the app README).
    # Runtipi removes the image on install/update, so it must be pullable from there.
    image: 127.0.0.1:5000/nash-vechir:1.1.0
    restart: unless-stopped
    environment:
      - PASSWORD_MAKSYM=${NV_PASSWORD_MAKSYM}
      - PASSWORD_LIUDA=${NV_PASSWORD_LIUDA}
      - APP_URL=${NV_APP_URL}
      - APP_TIMEZONE=${NV_APP_TIMEZONE:-America/Toronto}
      - REMINDER_HOURS=${NV_REMINDER_HOURS:-3}
      - TELEGRAM_BOT_TOKEN=${NV_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID_MAKSYM=${NV_TELEGRAM_CHAT_ID_MAKSYM:-}
      - TELEGRAM_CHAT_ID_WIFE=${NV_TELEGRAM_CHAT_ID_WIFE:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: wget -qO- http://127.0.0.1:8080/healthz || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
